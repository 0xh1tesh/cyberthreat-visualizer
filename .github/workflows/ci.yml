name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - run: npm ci
      # server/index.test.js loads express and friends from server/node_modules
      - run: npm ci
        working-directory: server
      - run: npm run lint
      - run: npm test
      - run: npm run build
